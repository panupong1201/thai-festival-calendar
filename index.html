 <details class="acc"><summary>ขั้นตอนพิธี/กิจกรรม</summary><div class="bd"><ol class="k">${e.steps.map(x=>`<li>${x}</li>`).join('')}</ol></div></details>
 <details class="acc"><summary>ของไหว้/ของที่ต้องเตรียม</summary><div class="bd">${L(e.items)}</div></details>
 <details class="acc"><summary>การแต่งกายที่เหมาะสม</summary><div class="bd">${e.attire}</div></details>
 <details class="acc"><summary>ข้อควรทำ / ข้อควรระวัง</summary><div class="bd"><b class="ok">ควรทำ</b>${L(e.dos)}<b class="no" style="display:block;margin-top:8px">ควรระวัง</b>${L(e.donts)}</div></details>
 <details class="acc"><summary>อาหารที่เกี่ยวข้อง</summary><div class="bd">${L(e.foods)}</div></details>
 <details class="acc"><summary>แหล่งอ้างอิง</summary><div class="bd"><ul class="k">${e.src.map(u=>`<li><a href="${u}" target="_blank" rel="noopener">${u.replace(/^https?:\/\//,'').slice(0,60)}</a></li>`).join('')}</ul></div></details>`;
 $('#v-detail').innerHTML=h;go('detail',false);
 $('#bk').onclick=()=>go(prev,false);
 $('#favBtn').onclick=()=>toggleFav(id);
 $('#remBtn').onclick=async()=>{const i=rem.indexOf(id);if(i>=0){rem.splice(i,1);toast('ยกเลิกการเตือนแล้ว')}else{rem.push(id);toast('ตั้งเตือนแล้ว จะแจ้งก่อนวันงาน 7 วัน');try{if('Notification' in window&&Notification.permission==='default')await Notification.requestPermission()}catch(x){}}store.set('rem',rem);openDetail(id)};
 $('#shBtn').onclick=async()=>{const txt=`${e.name} · ${range(e)} ${be(2026)} · ${e.prov}\n${e.history.slice(0,120)}...`;
  try{if(navigator.share){await navigator.share({title:e.name,text:txt,url:location.href.split('#')[0]});return}}catch(x){return}
  try{await navigator.clipboard.writeText(txt+'\n'+location.href.split('#')[0]);toast('คัดลอกข้อความสำหรับแชร์แล้ว')}catch(x){prompt('คัดลอกข้อความนี้',txt)}}}
/* ---------- quiz ---------- */
let qz=null;
function renderQuizIntro(){
 $('#v-quiz').innerHTML=`<div class="hero"><h2>ทดสอบความรู้ประเพณีไทย</h2><p style="margin:6px 0 12px">สุ่ม 8 ข้อจากคลัง ${QUIZ.length} ข้อ ตอบแล้วรู้ผลทันที</p><button class="btn gold" id="qs">เริ่มทำแบบทดสอบ</button></div>
 <div class="card">คะแนนสูงสุดของคุณ: <b>${best?best.s+'/'+best.n+' ('+best.d+')':'ยังไม่เคยทำ'}</b></div>`;
 $('#qs').onclick=startQuiz}
function startQuiz(){const idx=[...QUIZ.keys()].sort(()=>Math.random()-.5).slice(0,8);qz={idx,i:0,s:0,done:false};renderQ()}
function renderQ(){
 if(qz.i>=qz.idx.length){const d=new Date();const ds=d.getDate()+' '+MS[d.getMonth()];if(!best||qz.s>best.s){best={s:qz.s,n:qz.idx.length,d:ds};store.set('best',best)}
  const p=qz.s/qz.idx.length;$('#v-quiz').innerHTML=`<div class="hero"><h2>ผลคะแนน</h2><div class="big" style="margin:8px 0">${qz.s}/${qz.idx.length}</div><p>${p>=.8?'ยอดเยี่ยม! คุณรู้จักประเพณีไทยดีมาก':p>=.5?'ทำได้ดี ลองอ่านรายละเอียดงานเพิ่มอีกนิด':'ลองอ่านรายละเอียดประเพณีแล้วกลับมาทำใหม่นะ'}</p><div class="row"><button class="btn gold" id="qa">ทำอีกครั้ง</button><button class="btn line" style="background:#fff" onclick="go('list')">ไปอ่านประเพณี</button></div></div><div class="card">คะแนนสูงสุด: <b>${best.s}/${best.n}</b></div>`;$('#qa').onclick=startQuiz;return}
 const [qq,ch,ans,exp]=QUIZ[qz.idx[qz.i]];
 $('#v-quiz').innerHTML=`<div class="note">ข้อ ${qz.i+1} จาก ${qz.idx.length} · คะแนน ${qz.s}</div><div class="prog"><i style="width:${qz.i/qz.idx.length*100}%"></i></div>
 <div class="card"><h3 style="margin-bottom:8px">${qq}</h3>${ch.map((c,i)=>`<button class="q-opt" data-i="${i}">${c}</button>`).join('')}<div id="fb"></div></div>`;
 document.querySelectorAll('.q-opt').forEach(b=>b.onclick=()=>{if(qz.done)return;qz.done=true;const i=+b.dataset.i;
  document.querySelectorAll('.q-opt').forEach(x=>{if(+x.dataset.i===ans)x.classList.add('right')});
  if(i===ans)qz.s++;else b.classList.add('wrong');
  $('#fb').innerHTML=`<p><b class="${i===ans?'ok':'no'}">${i===ans?'ถูกต้อง!':'ยังไม่ถูก'}</b> ${exp}</p><button class="btn" id="nx">${qz.i+1>=qz.idx.length?'ดูผลคะแนน':'ข้อถัดไป'}</button>`;
  $('#nx').onclick=()=>{qz.i++;qz.done=false;renderQ()}})}
/* ---------- me ---------- */
function renderMe(){
 const f=fav.map(evById).filter(Boolean),r=rem.map(evById).filter(Boolean);
 const perm=('Notification' in window)?Notification.permission:'unsupported';
 $('#v-me').innerHTML=`<div class="sec-t">⭐ รายการโปรด (${f.length})</div>${f.length?f.map(card).join(''):'<div class="card note">ยังไม่มีรายการโปรด กดดาว ☆ ที่งานที่ชอบ</div>'}
 <div class="sec-t">🔔 งานที่ตั้งเตือนไว้ (${r.length})</div>${r.length?r.map(e=>card(e)+`<div style="margin:-6px 0 12px"><button class="btn line" data-unrem="${e.id}">ยกเลิกเตือน ${e.name}</button></div>`).join(''):'<div class="card note">ยังไม่มีการเตือน เปิดหน้ารายละเอียดงานแล้วกด 🔔 ตั้งเตือน</div>'}
 <div class="card note">การเตือน: แอปจะแสดงแถบแจ้งเตือนบนหน้าแรกเมื่องานใกล้ถึง (ภายใน 7 วัน) และแจ้งเตือนจากเบราว์เซอร์ถ้าอนุญาต (สถานะ: ${perm==='granted'?'อนุญาตแล้ว':perm==='denied'?'ถูกปิดไว้':perm==='unsupported'?'เบราว์เซอร์ไม่รองรับ':'ยังไม่ได้ขออนุญาต'})</div>`;
 document.querySelectorAll('[data-unrem]').forEach(b=>b.onclick=()=>{rem=rem.filter(x=>x!==b.dataset.unrem);store.set('rem',rem);renderMe();toast('ยกเลิกการเตือนแล้ว')})}
/* ---------- font size ---------- */
function applyBig(){document.documentElement.classList.toggle('bigtext',big);const b=$('#fontBtn');b.classList.toggle('on',big);b.setAttribute('aria-pressed',big)}
$('#fontBtn').onclick=()=>{big=!big;store.set('big',big);applyBig();toast(big?'เปิดโหมดตัวอักษรใหญ่':'กลับเป็นตัวอักษรปกติ')};
applyBig();
/* ---------- browser notification on open ---------- */
function notifyDue(){try{if(!('Notification' in window)||Notification.permission!=='granted')return;const t=today();rem.map(evById).filter(e=>e&&pd(e.e)>=t&&days(pd(e.s),t)<=7).forEach(e=>new Notification('ใกล้ถึงงาน: '+e.name,{body:status(e).t+' · '+range(e)}))}catch(x){}}
renderHome();notifyDue();
</script>
